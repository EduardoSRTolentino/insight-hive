<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Análise multiagente de arquivos CSV e JSON." />
    <title>Insight Hive</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('insight-hive-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">Carregando Insight Hive...</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
