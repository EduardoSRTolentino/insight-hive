services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app/backend
      - ./transcript_cleaner:/app/transcript_cleaner
    environment:
      APP_ENV: development
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # Garante deps novas (ex.: bcrypt) sem exigir rebuild da imagem a cada requirements.txt.
    command:
      [
        "sh",
        "-c",
        "pip install -q -r requirements.txt && uvicorn api:app --reload --host 0.0.0.0 --port 8000 --reload-dir /app/backend --reload-dir /app/transcript_cleaner",
      ]

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"

volumes:
  frontend_node_modules:
