[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-cleaner"
version = "0.1.0"
description = "Independent meeting transcript cleaning pipeline for LLM token reduction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
transcript-cleaner = "transcript_cleaner.__main__:main"

[tool.setuptools.packages.find]
include = ["transcript_cleaner*"]

[tool.setuptools.package-data]
transcript_cleaner = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
